<style>
@import url('https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap');

/* ==========================================================================
   GREEN ENERGY CHALLENGE - 2-PLAYER DUAL TUG OF WAR
   PT Krakatau Chandra Energi (KCE) - A member of Chandra Asri Group
   Visual Guidelines 2025: Red Hat Display Family, Deep Corporate Navy (#2F407E),
   Corporate Blue (#4375BD), Sky Tint (#D2ECF3), Slate Dark (#294162),
   Brand Tagline #YourGrowthPartner, Editorial Solid Color Word Blocks.
   ========================================================================== */

:root {
  --font-main: 'Red Hat Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --gt-eesti-font-family: var(--font-main);

  /* Chandra Asri Group Visual Guideline 2025 Identity Palette */
  --cap-navy: #2F407E;
  --cap-navy-deep: #1E2B58;
  --cap-slate: #294162;
  --cap-blue: #4375BD;
  --cap-blue-hover: #3463A5;
  --cap-sky: #D2ECF3;
  --cap-sky-light: #EBF7FA;
  --cap-steel: #96A7B5;
  --cap-steel-dark: #7F8491;
  --cap-border: #CBD1D4;
  --cap-bg-page: #F6F2F2;

  --navy: #2F407E;
  --navy-deep: #1E2B58;
  --blue-primary: #4375BD;
  --blue-hover: #3463A5;
  --blue-light: #EBF7FA;
  --blue-cyan: #38BDF8;
  --green-energy: #20A66A;
  --green-bright: #28B977;
  --green-deep: #198051;
  --green-light: #E8F7F0;
  --solar-yellow: #FFB800;
  --solar-amber: #E29A00;
  --red-accent: #D3312B;
  --white: #FFFFFF;
  --light-grey: #F6F2F2;
  --slate-border: #CBD1D4;
  --text-dark: #111827;
  --text-muted: #6B7280;

  --card-shadow: 0 4px 16px rgba(47, 64, 126, 0.08);
  --card-shadow-hover: 0 8px 24px rgba(67, 117, 189, 0.16);
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --transition-fast: 0.15s ease-out;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

input, textarea { user-select: text; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-main);
  background: var(--cap-bg-page);
  background-image: radial-gradient(var(--cap-border) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--text-dark);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }

#app-container {
  max-width: 1240px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 10px 16px 14px;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
}

/* Top Navbar */
.top-navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 20px;
  margin-top: 12px;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(10px);
  border: 2px solid var(--slate-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--card-shadow);
}

.brand-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.kce-brand-logo {
  height: 40px;
  width: auto;
  object-fit: contain;
  display: block;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 2px solid var(--slate-border);
  background: #FFFFFF;
  color: var(--navy-deep);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: 800;
  font-size: 0.88rem;
  transition: var(--transition-fast);
  text-decoration: none;
}

.nav-btn svg { width: 18px; height: 18px; fill: currentColor; }
.nav-btn:hover { border-color: var(--blue-primary); color: var(--blue-primary); transform: translateY(-2px); }
.nav-btn.active { background: var(--blue-primary); border-color: var(--blue-primary); color: #FFFFFF; }

/* Screens */
.game-screen {
  display: none;
  flex: 1;
  width: 100%;
  padding: 14px 4px;
}
.game-screen.active {
  display: flex !important;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* Welcome Screen */
.welcome-hero {
  max-width: 860px;
  margin: 6px auto 0;
  background: #FFFFFF;
  border: 2px solid var(--slate-border);
  border-radius: 24px;
  box-shadow: var(--card-shadow);
  padding: 34px 28px 30px;
  text-align: center;
}

.hero-pill-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--blue-light);
  color: var(--navy-deep);
  border: 1.5px solid rgba(48, 119, 181, 0.25);
  border-radius: var(--radius-full);
  padding: 6px 16px;
  font-size: 0.85rem;
  font-weight: 800;
  margin-bottom: 14px;
}

.hero-pill-badge img {
  width: 18px;
  height: 18px;
  object-fit: contain;
}

.hero-title {
  font-size: clamp(2rem, 4.8vw, 3.2rem);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
  margin: 4px 0 10px;
}

.highlight-blue, .cap-block-blue {
  background-color: var(--cap-blue);
  color: #FFFFFF !important;
  padding: 3px 12px;
  border-radius: 6px;
  display: inline-block;
  box-shadow: 0 2px 6px rgba(67, 117, 189, 0.2);
}
.highlight-green, .cap-block-navy {
  background-color: var(--cap-navy);
  color: #FFFFFF !important;
  padding: 3px 12px;
  border-radius: 6px;
  display: inline-block;
  box-shadow: 0 2px 6px rgba(47, 64, 126, 0.2);
}
.cap-block-green {
  background-color: var(--green-energy);
  color: #FFFFFF !important;
  padding: 3px 12px;
  border-radius: 6px;
  display: inline-block;
}

.hero-subtitle {
  color: var(--text-muted);
  font-size: 1.02rem;
  font-weight: 500;
  max-width: 600px;
  margin: 0 auto 10px;
}

.kce-tagline-img {
  height: 48px;
  width: auto;
  object-fit: contain;
  margin: 6px auto 20px;
  display: block;
}

.welcome-preview-stage {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 10px;
  max-width: 520px;
  margin: 4px auto 22px;
}

.preview-char-box { width: 130px; height: 145px; }
.preview-char-box img, .preview-char-box svg {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.preview-rope-box {
  flex: 1;
  position: relative;
  height: 36px;
  margin-bottom: 42px;
}

.preview-vs-bubble {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 48px;
  height: 48px;
  background: #FFFFFF;
  border: 2.5px solid var(--slate-border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 1rem;
  color: var(--navy-deep);
  box-shadow: var(--card-shadow);
  z-index: 2;
}

.btn-cta-main {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 10px;
  padding: 14px 34px;
  border: 3px solid #FFFFFF;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--blue-primary), var(--navy));
  color: #FFFFFF;
  font-size: 1.2rem;
  font-weight: 900;
  letter-spacing: 0.02em;
  box-shadow: 0 10px 24px rgba(30, 58, 122, 0.28);
  cursor: pointer;
  transition: var(--transition-fast);
}

.btn-cta-main:hover {
  background: linear-gradient(135deg, var(--blue-hover), var(--navy-deep));
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(30, 58, 122, 0.35);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 8px;
  padding: 12px 24px;
  border: 2px solid transparent;
  border-radius: 12px;
  background: var(--blue-primary);
  color: #FFFFFF;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition-fast);
}

.btn-primary:hover {
  background: var(--blue-hover);
  transform: translateY(-2px);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 8px;
  padding: 11px 22px;
  border: 2px solid var(--slate-border);
  border-radius: 12px;
  background: #FFFFFF;
  color: var(--navy-deep);
  font-size: 0.95rem;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition-fast);
}

.btn-secondary:hover {
  border-color: var(--blue-primary);
  color: var(--blue-primary);
  transform: translateY(-2px);
}

/* Registration Screen Centering */
#reg-screen {
  min-height: calc(85vh - 75px);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px 16px;
}

#reg-screen.active {
  display: flex !important;
}

.reg-screen-inner {
  width: 100%;
  max-width: 840px;
  margin: auto;
}

.reg-header {
  text-align: center;
  margin-bottom: 28px;
}

.reg-header h2 {
  font-size: 2.3rem;
  font-weight: 900;
  color: var(--navy-deep);
  letter-spacing: -0.5px;
}

.reg-header p {
  color: var(--text-muted);
  font-size: 1.05rem;
  margin-top: 6px;
}

.players-registration-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 28px;
}

.reg-actions {
  display: flex;
  justify-content: center;
  gap: 16px;
}

/* Clean Arcade Countdown Overlay (NO AI SLOP) */
.arena-countdown-overlay {
  background: rgba(7, 30, 56, 0.75) !important;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1300;
}

.arena-countdown-overlay.active {
  display: flex !important;
}

.countdown-card {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.countdown-matchup {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.22);
  padding: 10px 24px;
  border-radius: var(--radius-full);
}

.player-tag {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.player-tag.blue { color: #7DD3FC; }
.player-tag.green { color: #86EFAC; }

.vs-pill {
  font-size: 0.85rem;
  font-weight: 900;
  color: #FCD34D;
  background: rgba(0, 0, 0, 0.35);
  padding: 3px 9px;
  border-radius: var(--radius-full);
}

.countdown-big-number {
  font-size: 7.5rem;
  font-weight: 900;
  color: #FFFFFF;
  line-height: 1;
  font-family: inherit;
  letter-spacing: -2px;
  animation: countdownPulse 0.85s ease-out;
}

@keyframes countdownPulse {
  0% { transform: scale(1.35); opacity: 0.15; }
  35% { transform: scale(1); opacity: 1; }
  85% { transform: scale(0.98); opacity: 1; }
  100% { transform: scale(0.9); opacity: 0.85; }
}

/* Registration */
.players-registration-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  max-width: 880px;
  margin: 0 auto 22px;
}

.player-card-panel {
  background: #FFFFFF;
  border: 2px solid var(--slate-border);
  border-radius: 18px;
  padding: 20px 18px;
  box-shadow: var(--card-shadow);
}

.player-card-panel.blue-team { border-top: 5px solid var(--blue-primary); }
.player-card-panel.green-team { border-top: 5px solid var(--green-energy); }

.player-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.team-badge-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  background: var(--blue-light);
  color: var(--navy-deep);
}

.team-badge-tag.green { background: var(--green-light); }

.team-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}

.team-dot.blue { background: var(--blue-primary); }
.team-dot.green { background: var(--green-energy); }

.form-group { margin-bottom: 12px; text-align: left; }
.form-group label {
  display: block;
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--text-muted);
  margin-bottom: 5px;
  text-transform: uppercase;
}

.form-group input {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid var(--slate-border);
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-dark);
  background: var(--light-grey);
}

.form-group input:focus {
  outline: none;
  border-color: var(--blue-primary);
  background: #FFFFFF;
}

.category-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  padding: 6px 12px;
  border-radius: var(--radius-full);
  border: 2px solid var(--slate-border);
  background: #FFFFFF;
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-muted);
  cursor: pointer;
  transition: var(--transition-fast);
}
.chip-btn.selected-p1 { background: var(--blue-light); border-color: var(--blue-primary); color: var(--navy-deep); }
.chip-btn.selected-p2 { background: var(--green-light); border-color: var(--green-energy); color: var(--navy-deep); }

/* Character Select Screen */
.char-select-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  max-width: 900px;
  margin: 0 auto;
}

.char-column-header {
  font-weight: 900;
  padding: 10px 14px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 0.95rem;
}

.char-column-header.blue { background: var(--blue-light); color: var(--navy-deep); }
.char-column-header.green { background: var(--green-light); color: var(--navy-deep); }

.character-grid-mini {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.char-card-mini {
  background: #FFFFFF;
  border: 2px solid var(--slate-border);
  border-radius: 16px;
  padding: 12px 8px 12px;
  text-align: center;
  cursor: pointer;
  position: relative;
  transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s ease, border-color 0.18s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.char-card-mini:hover {
  transform: translateY(-3px);
  border-color: var(--blue-primary);
  box-shadow: 0 8px 20px rgba(47, 64, 126, 0.08);
}
.char-card-mini h4,
.char-card-name {
  font-size: 0.96rem;
  font-weight: 900;
  color: var(--navy-deep);
  margin: 4px 0 0;
  letter-spacing: 0.02em;
}
.avatar-mini-box { height: 90px; width: 100%; display: flex; align-items: flex-end; justify-content: center; overflow: visible; }
.avatar-mini-box svg { height: 100%; max-height: 90px; width: auto; overflow: visible; }
.avatar-mini-box img { height: 100%; max-height: 90px; width: auto; object-fit: contain; }

.char-card-mini.active-p1 {
  border-color: var(--blue-primary);
  background: linear-gradient(180deg, #F0F9FF 0%, #FFFFFF 100%);
  box-shadow: 0 6px 18px rgba(2, 132, 199, 0.22);
}
.char-card-mini.active-p2 {
  border-color: var(--green-energy);
  background: linear-gradient(180deg, #F0FDF4 0%, #FFFFFF 100%);
  box-shadow: 0 6px 18px rgba(16, 185, 129, 0.22);
}

.char-card-mini.active-p1::after,
.char-card-mini.active-p2::after {
  position: absolute;
  top: -8px;
  right: -6px;
  color: #FFFFFF;
  font-size: 0.72rem;
  font-weight: 900;
  padding: 3px 9px;
  border-radius: var(--radius-full);
  border: 2.5px solid #FFFFFF;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
}

.char-card-mini.active-p1::after { content: 'P1'; background: var(--blue-primary); }
.char-card-mini.active-p2::after { content: 'P2'; background: var(--green-energy); }
.char-card-mini.disabled-taken { opacity: 0.45; filter: grayscale(0.8); cursor: not-allowed; }

.char-ready-stage {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  background: var(--light-grey);
  border: 2px dashed var(--slate-border);
  border-radius: 18px;
  padding: 14px;
  margin: 18px auto;
  max-width: 900px;
  box-sizing: border-box;
}

.ready-hero-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #FFFFFF;
  border: 2px solid var(--slate-border);
  border-radius: 14px;
  padding: 8px 16px;
  min-width: 180px;
  box-sizing: border-box;
}

.ready-hero-avatar { width: 65px; height: 75px; }
.ready-hero-avatar img, .ready-hero-avatar svg, #victory-winner-avatar svg, #victory-loser-avatar svg {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.ready-vs-badge .vs-short-text {
  display: none;
}
.ready-vs-badge .vs-full-text {
  display: inline;
}

.char-actions-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  width: 100%;
  margin-top: 14px;
  box-sizing: border-box;
}

/* ==========================================================================
   ARENA SCREEN: BATTLEFIELD + 30-SECOND INDEPENDENT TIMERS PER SOAL
   ========================================================================== */

.arena-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 8px;
}

.arena-player-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #FFFFFF;
  border: 2px solid var(--slate-border);
  border-radius: 14px;
  padding: 8px 16px;
  box-shadow: var(--card-shadow);
  min-width: 200px;
}

.arena-player-pill.blue { border-left: 5px solid var(--blue-primary); }
.arena-player-pill.green { border-right: 5px solid var(--green-energy); }
.arena-player-name { font-weight: 900; font-size: 1rem; color: var(--navy-deep); }
.arena-player-score { font-size: 1.5rem; font-weight: 900; }
.arena-player-pill.blue .arena-player-score { color: var(--blue-primary); }
.arena-player-pill.green .arena-player-score { color: var(--green-deep); }

.arena-round-pill {
  background: #FFFFFF;
  border: 2px solid var(--slate-border);
  border-radius: var(--radius-full);
  padding: 6px 18px;
  font-weight: 900;
  font-size: 0.95rem;
  color: var(--navy-deep);
  box-shadow: var(--card-shadow);
}

.arena-center-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-arena-exit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: #FFFFFF;
  border: 1.5px solid #E2E8F0;
  border-radius: var(--radius-full);
  padding: 6px 14px;
  font-size: 0.82rem;
  font-weight: 800;
  color: #64748B;
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
  touch-action: manipulation;
  user-select: none;
}

.btn-arena-exit:hover {
  background: #FEE2E2;
  border-color: #FCA5A5;
  color: #DC2626;
  transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(220, 38, 38, 0.15);
}

.btn-arena-exit:active {
  transform: translateY(1px);
}

/* Battlefield Canvas */
.tug-battlefield-wrapper {
  position: relative;
  width: 100%;
  height: 220px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--card-shadow);
  margin-bottom: 14px;
}

.tug-battlefield-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Dual Question Pods with 30s Timer per Soal */
.dual-questions-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.player-question-card {
  background: #FFFFFF;
  border: 2.5px solid var(--slate-border);
  border-radius: 18px;
  padding: 16px 18px 18px;
  box-shadow: var(--card-shadow);
  display: flex;
  flex-direction: column;
}

.player-question-card.blue-card { border-top: 5px solid var(--blue-primary); }
.player-question-card.green-card { border-top: 5px solid var(--green-energy); }

.q-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.q-player-badge {
  font-size: 0.82rem;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: var(--radius-full);
}

.q-player-badge.blue { background: var(--blue-light); color: var(--navy-deep); }
.q-player-badge.green { background: var(--green-light); color: var(--navy-deep); }

/* 30-Second Timer Badge per Soal */
.q-timer-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--light-grey);
  border: 2px solid var(--slate-border);
  color: var(--navy-deep);
  border-radius: var(--radius-full);
  padding: 4px 12px;
  font-weight: 900;
  font-size: 0.88rem;
  transition: var(--transition-fast);
}

.q-timer-badge.urgent {
  background: var(--red-accent);
  border-color: var(--red-accent);
  color: #FFFFFF;
  animation: timerPulse 0.7s infinite alternate;
}

@keyframes timerPulse {
  from { transform: scale(1); }
  to { transform: scale(1.08); }
}

.q-category-tag { display: none !important; }

.q-question-text {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--navy-deep);
  line-height: 1.35;
  margin: 6px 0 12px;
  min-height: 3.2em;
}

.q-answers-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  flex: 1;
}

.btn-dual-answer {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 2px solid var(--slate-border);
  border-radius: 12px;
  background: #FFFFFF;
  color: var(--text-dark);
  font-size: 0.92rem;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  transition: var(--transition-fast);
}

.btn-dual-answer:hover:not(:disabled) {
  border-color: var(--blue-primary);
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(20, 41, 74, 0.08);
}

.player-question-card.green-card .btn-dual-answer:hover:not(:disabled) {
  border-color: var(--green-energy);
}

.btn-dual-answer:disabled { opacity: 0.7; cursor: default; }

.dual-ans-letter {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--light-grey);
  color: var(--navy-deep);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  flex: none;
}

.btn-dual-answer.correct {
  background: var(--green-light);
  border-color: var(--green-energy);
  color: var(--navy-deep);
}
.btn-dual-answer.correct .dual-ans-letter {
  background: var(--green-energy);
  color: #FFFFFF;
}

.btn-dual-answer.incorrect {
  background: #FFF2F2;
  border-color: var(--red-accent);
}
.btn-dual-answer.incorrect .dual-ans-letter {
  background: var(--red-accent);
  color: #FFFFFF;
}

.q-status-feedback {
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 0.82rem;
  font-weight: 700;
  display: none;
}

.q-status-feedback.show { display: block; }
.q-status-feedback.correct { background: var(--green-light); color: var(--green-deep); border: 1.5px solid rgba(60,151,108,0.3); }
.q-status-feedback.incorrect { background: #FFF2F2; color: var(--red-accent); border: 1.5px solid rgba(211,49,43,0.3); }

/* Victory Modal - Full Landscape Stadium Layout (Zero Vertical Scroll) */
.overlay-modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(8px);
  z-index: 1200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-y: auto;
}

.overlay-modal.active { display: flex; }

.celebration-box {
  position: relative;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding: 8px 12px;
  width: min(920px, 98vw);
  max-width: 940px;
  max-height: 96vh;
  text-align: center;
  margin: auto;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.celebration-box.blue-theme,
.celebration-box.green-theme {
  border: none !important;
}

/* Header Banner (Horizontal Trophy + Title + Subtitle) */
.victory-header-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  margin-bottom: 2px;
}

.victory-trophy-badge {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.4));
}
.victory-trophy-badge svg {
  width: 100%;
  height: 100%;
  display: block;
}

.victory-title-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.victory-title-wrap h2 {
  font-size: 2.1rem;
  font-weight: 900;
  line-height: 1.15;
  margin: 0;
  color: #38BDF8;
  letter-spacing: 0.03em;
  text-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
}

.celebration-box.green-theme .victory-title-wrap h2 {
  color: #34D399;
}

.victory-title-wrap p {
  font-size: 0.95rem;
  color: #E2E8F0;
  margin: 4px 0 0;
  font-weight: 600;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
}

/* 3-Column Landscape Layout (Winner Left | Center Hub | Loser Right) */
.victory-landscape-grid {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 16px;
  width: 100%;
  box-sizing: border-box;
}

/* Character Slots */
.avatar-result-slot {
  flex: 0 0 190px;
  width: 190px;
  background: #FFFFFF;
  border: 2.5px solid var(--slate-border);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 12px 10px 14px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
  min-height: 280px;
  box-sizing: border-box;
}

.avatar-result-slot.winner-card-slot {
  background: #FFFFFF;
  border: 3px solid var(--blue-primary);
  box-shadow: 0 12px 36px rgba(2, 132, 199, 0.35);
}
.celebration-box.blue-theme .avatar-result-slot.winner-card-slot {
  background: #FFFFFF;
  border-color: var(--blue-primary);
  box-shadow: 0 12px 36px rgba(2, 132, 199, 0.35);
}
.celebration-box.green-theme .avatar-result-slot.winner-card-slot {
  background: #FFFFFF;
  border-color: var(--green-energy);
  box-shadow: 0 12px 36px rgba(16, 185, 129, 0.35);
}

.avatar-result-slot.loser-card-slot {
  background: #FFFFFF;
  border: 2.5px solid #CBD5E1;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
}

.avatar-result-slot svg {
  width: auto;
  max-width: 100%;
  height: 155px;
  display: block;
  margin: 2px auto;
}

.slot-player-title {
  font-size: 0.9rem;
  font-weight: 800;
  color: var(--navy-deep);
  text-align: center;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.result-stamp {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 5px 18px;
  border-radius: var(--radius-full);
  font-size: 0.84rem;
  font-weight: 900;
  color: #FFFFFF;
  white-space: nowrap;
  box-shadow: 0 3px 8px rgba(20, 41, 74, 0.15);
  border: 2px solid #FFFFFF;
  margin-top: 4px;
}

.result-stamp.winner {
  background: var(--green-energy);
  background: linear-gradient(180deg, #10B981 0%, #059669 100%);
}
.celebration-box.blue-theme .result-stamp.winner {
  background: var(--blue-primary);
  background: linear-gradient(180deg, #2563EB 0%, #1D4ED8 100%);
}
.result-stamp.loser {
  background: #64748B;
}

/* Center Hub */
.victory-center-hub {
  flex: 1 1 420px;
  max-width: 460px;
  min-width: 300px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 14px;
  background: #FFFFFF;
  border: 2px solid #E2E8F0;
  border-radius: 22px;
  padding: 18px 20px 20px;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
  box-sizing: border-box;
  animation: hubSoftEnter 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes hubSoftEnter {
  0% { opacity: 0; transform: translateY(12px) scale(0.97); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.victory-hub-header {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 2px;
}

.hub-kpi-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: #F1F5F9;
  border: 1.5px solid #CBD5E1;
  color: #334155;
  font-weight: 800;
  font-size: 0.76rem;
  letter-spacing: 0.06em;
  padding: 4px 14px;
  border-radius: var(--radius-full);
}

.match-stats-grid-2x2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 0;
}

.match-metric-card {
  background: #F8FAFC;
  border: 1.5px solid #E2E8F0;
  border-radius: 14px;
  padding: 10px 14px;
  text-align: left;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, box-shadow 0.2s ease;
}

.match-metric-card:hover {
  background: #FFFFFF;
  border-color: #CBD5E1;
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
}

.match-metric-card h5 {
  font-size: 0.70rem;
  color: #64748B;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 0 0 3px;
}

.match-metric-card p {
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--navy-deep);
  margin: 0;
  line-height: 1.1;
}

/* Action Buttons Row */
.victory-actions-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  margin-top: 2px;
}

.victory-actions-row .btn-start-tug {
  width: 100%;
  height: 48px;
  min-height: 48px;
  padding: 0 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
  color: #FFFFFF !important;
  font-weight: 900;
  font-size: 1rem;
  letter-spacing: 0.04em;
  border: 2px solid #FFFFFF;
  border-radius: 9999px;
  box-shadow: 0 4px 16px rgba(217, 119, 6, 0.4);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  white-space: nowrap;
  animation: ctaBtnPulse 2.4s ease-in-out infinite;
}

@keyframes ctaBtnPulse {
  0%, 100% {
    box-shadow: 0 4px 16px rgba(217, 119, 6, 0.4);
  }
  50% {
    box-shadow: 0 6px 24px rgba(245, 158, 11, 0.65), 0 0 12px rgba(251, 191, 36, 0.35);
  }
}

.victory-actions-row .btn-start-tug:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(217, 119, 6, 0.55);
}

.victory-actions-row .btn-start-tug:active {
  transform: scale(0.98);
}

.victory-actions-secondary-row {
  display: flex;
  gap: 10px;
  width: 100%;
}

.victory-actions-secondary-row .btn-compact {
  flex: 1;
  height: 38px;
  min-height: 38px;
  padding: 0 12px !important;
  font-size: 0.82rem !important;
  font-weight: 800;
  white-space: nowrap;
  border-radius: 9999px !important;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #FFFFFF;
  border: 1.5px solid #CBD5E1;
  color: var(--navy-deep);
  transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  min-width: 0 !important;
  cursor: pointer;
}

.victory-actions-secondary-row .btn-compact:hover {
  background: #F1F5F9;
  border-color: var(--blue-primary);
  color: var(--blue-primary);
  transform: translateY(-1px);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
}

.victory-actions-secondary-row .btn-compact:active {
  transform: scale(0.97);
}

/* Micro-Animations & Atmospheric Polish */
.overlay-modal.active .celebration-box {
  animation: victoryModalZoomIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes victoryModalZoomIn {
  0% {
    opacity: 0;
    transform: scale(0.92) translateY(20px);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.victory-trophy-badge {
  animation: trophyGentleFloat 3s ease-in-out infinite;
}

@keyframes trophyGentleFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-4px) rotate(2deg); }
}

.avatar-result-slot.winner-card-slot {
  animation: winnerAuraBlue 2.5s ease-in-out infinite alternate;
}

@keyframes winnerAuraBlue {
  0% {
    box-shadow: 0 12px 32px rgba(2, 132, 199, 0.28), 0 0 0 1px rgba(2, 132, 199, 0.2);
  }
  100% {
    box-shadow: 0 16px 42px rgba(2, 132, 199, 0.45), 0 0 18px rgba(56, 189, 248, 0.35);
  }
}

.celebration-box.green-theme .avatar-result-slot.winner-card-slot {
  animation: winnerAuraGreen 2.5s ease-in-out infinite alternate;
}

@keyframes winnerAuraGreen {
  0% {
    box-shadow: 0 12px 32px rgba(16, 185, 129, 0.28), 0 0 0 1px rgba(16, 185, 129, 0.2);
  }
  100% {
    box-shadow: 0 16px 42px rgba(16, 185, 129, 0.45), 0 0 18px rgba(52, 211, 153, 0.35);
  }
}

.avatar-result-slot.winner-card-slot svg {
  animation: avatarWinBounce 2.4s ease-in-out infinite;
}

@keyframes avatarWinBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.avatar-result-slot.loser-card-slot svg {
  animation: avatarSadBreath 3s ease-in-out infinite;
}

@keyframes avatarSadBreath {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(3px); }
}

.result-stamp.winner {
  animation: stampJuaraPulse 2.2s ease-in-out infinite;
}

@keyframes stampJuaraPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

/* Screen Transition Animation */
.game-screen.active {
  animation: screenFadeSlideIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes screenFadeSlideIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Responsive for narrow screens / mobile portrait */
@media (max-width: 768px) {
  .celebration-box {
    padding: 10px;
    max-height: 96vh;
    overflow-y: auto !important;
  }
  .victory-landscape-grid {
    flex-wrap: wrap;
    gap: 12px;
  }
  .avatar-result-slot {
    flex: 1 1 calc(50% - 8px);
    width: auto;
    min-height: 240px;
  }
  .victory-center-hub {
    flex: 1 1 100%;
    max-width: 100%;
    order: 3;
  }
  .victory-actions-row {
    flex-wrap: wrap;
  }
}

/* Certificate */
.certificate-container {
  background: #FFFFFF;
  border: 3px solid var(--navy);
  border-radius: 8px;
  padding: 10px;
  width: min(740px, 92vw);
}

.cert-border-inner {
  border: 2px solid var(--solar-amber);
  border-radius: 4px;
  padding: 30px 24px;
  text-align: center;
  background: linear-gradient(180deg, #FFFFFF 70%, var(--blue-light) 130%);
}

.cert-player-name {
  font-size: 1.9rem;
  font-weight: 900;
  color: var(--blue-primary);
  border-bottom: 3px solid var(--solar-amber);
  display: inline-block;
  padding: 4px 24px;
  margin: 10px 0 12px;
}

/* Leaderboard */
.leaderboard-card {
  max-width: 860px;
  margin: 0 auto;
  background: #FFFFFF;
  border: 2px solid var(--slate-border);
  border-radius: 22px;
  padding: 26px 22px;
  box-shadow: var(--card-shadow);
}

.leader-table { width: 100%; border-collapse: collapse; }
.leader-table th {
  text-align: left;
  font-size: 0.72rem;
  font-weight: 900;
  text-transform: uppercase;
  color: var(--text-muted);
  background: var(--light-grey);
  padding: 10px 12px;
  border-bottom: 2px solid var(--slate-border);
}
.leader-table td {
  padding: 11px 12px;
  border-bottom: 1.5px solid var(--slate-border);
  font-weight: 600;
}
.leader-table tr:hover td { background: var(--blue-light); }

/* Screen Centering & Max Widths */
#arena-screen.active {
  display: flex !important;
  flex-direction: column;
  justify-content: center;
  align-items: stretch;
  max-width: 1100px;
  margin: auto;
  width: 100%;
}

#welcome-screen.active,
#reg-screen.active,
#char-screen.active,
#leaderboard-screen.active {
  margin: auto;
}

/* Footer */
.app-footer {
  margin-top: auto;
  padding: 16px 14px 10px;
  border-top: 1.5px solid var(--slate-border);
  text-align: center;
  flex-shrink: 0;
  width: 100%;
}

.footer-line { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
.footer-line strong { color: var(--navy-deep); font-weight: 800; }
.footer-tagline { margin-top: 4px; font-size: 0.75rem; font-weight: 700; color: var(--blue-primary); letter-spacing: 0.04em; }

/* Responsive for Small Mobile Phones (< 520px) */
@media (max-width: 520px) {
  .dual-questions-grid { grid-template-columns: 1fr !important; }
  .players-registration-container { grid-template-columns: 1fr !important; }
  .char-select-columns { grid-template-columns: 1fr !important; }
  .character-grid-mini { grid-template-columns: repeat(2, 1fr) !important; }
  .arena-top-bar { flex-wrap: wrap; justify-content: center; }
  .arena-player-pill { min-width: 0; width: 100%; }
  .match-stats-grid { grid-template-columns: repeat(2, 1fr); }
  .q-answers-container { grid-template-columns: 1fr; }
}

   40-INCH PORTRAIT MONITOR & VERTICAL KIOSK TOTEM DISPLAY SYSTEM
   Optimized for 9:16 vertical displays (1080x1920, 1440x2560, 2160x3840)
   Two-Player Simultaneous Duel: Player 1 (Left) & Player 2 (Right) Side-by-Side
   ========================================================================== */

@media (min-width: 768px) and (orientation: portrait), (min-width: 768px) and (max-aspect-ratio: 13/16) {
  /* Kiosk Viewport Sizing & Touch Ergonomics */
  html, body {
    min-height: 100vh;
    touch-action: manipulation;
  }

  body {
    background-size: 32px 32px;
  }

  #app-container {
    max-width: 1020px;
    width: 100%;
    min-height: 100vh;
    padding: 16px 22px 20px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Top Navigation Bar on 40" Portrait Kiosk */
  .top-navbar {
    padding: 14px 22px;
    margin-top: 6px;
    margin-bottom: 14px;
    border-radius: 20px;
    border-width: 2.5px;
    box-shadow: 0 6px 20px rgba(47, 64, 126, 0.1);
  }
  .kce-brand-logo {
    height: 48px;
  }
  .nav-btn {
    width: 48px;
    height: 48px;
    font-size: 1.25rem;
    border-radius: 12px;
    border-width: 2px;
  }

  /* ---------------- WELCOME SCREEN (PORTRAIT 40") ---------------- */
  #welcome-screen.active {
    margin: auto 0;
    width: 100%;
    display: flex !important;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .welcome-hero {
    max-width: 960px;
    width: 100%;
    padding: 44px 32px 38px;
    border-radius: 28px;
    border-width: 2.5px;
    box-shadow: 0 12px 36px rgba(47, 64, 126, 0.12);
  }
  .hero-pill-badge {
    padding: 8px 22px;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }
  .hero-title {
    font-size: clamp(2.6rem, 5.2vw, 3.8rem);
    line-height: 1.1;
    margin: 6px 0 14px;
  }
  .hero-subtitle {
    font-size: 1.22rem;
    max-width: 720px;
    line-height: 1.5;
    margin: 0 auto 16px;
  }
  .kce-tagline-img {
    height: 58px;
    margin: 10px auto 26px;
  }
  .welcome-preview-stage {
    max-width: 660px;
    margin: 6px auto 32px;
    gap: 16px;
  }
  .preview-char-box {
    width: 165px;
    height: 185px;
  }
  .preview-rope-box {
    height: 44px;
    margin-bottom: 54px;
  }
  .preview-vs-bubble {
    width: 62px;
    height: 62px;
    font-size: 1.25rem;
    border-width: 3px;
  }
  .btn-cta-main {
    min-height: 74px;
    font-size: 1.35rem;
    font-weight: 900;
    padding: 18px 44px;
    border-radius: var(--radius-full);
    max-width: 520px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(67, 117, 189, 0.35);
  }
  .welcome-hero .btn-secondary {
    min-height: 56px;
    font-size: 1.12rem;
    padding: 14px 36px;
    border-radius: var(--radius-full);
